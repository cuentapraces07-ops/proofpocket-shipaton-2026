name: Android bundle smoke build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java for Gradle
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pnpm
        shell: bash
        run: |
          npm install --global pnpm@10.15.1
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate source and typecheck
        run: |
          pnpm validate
          pnpm typecheck

      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --no-install --non-interactive

      - name: Assemble release bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload unsigned release bundle for owner signing
        uses: actions/upload-artifact@v6
        with:
          name: proofpocket-android-release-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
